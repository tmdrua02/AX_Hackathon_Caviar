    ["바코드 스캔","등록","바코드를 제품 후보 식별에 사용하고 최신 성분을 재확인합니다.","바코드 스캔 선택 및 카메라 권한 허용","모든 사용자",["카메라 프리뷰","인식 영역","플래시","수동 입력","후보"],"스캔 후 후보를 확인하거나 미등록 처리로 이동합니다.","바코드는 후보 식별 수단이며 성분 구성의 최신성을 보장하지 않습니다.","DB 미등록 바코드는 직접 입력·성분표 촬영을 제공합니다.","바코드와 제품 버전·유통기한 변경 가능성을 함께 관리합니다."],
    ["약봉투·처방전 촬영 안내","OCR","신규 처방 제품과 복용정보를 선명하게 촬영하도록 안내합니다.","새 처방 스캔 선택","처방약 등록 사용자",["촬영 가이드","마스킹 안내","카메라·갤러리"],"촬영 또는 갤러리 선택으로 OCR 화면에 진입합니다.","OCR은 입력 보조이며 약명·성분·함량·단위를 자동 확정하지 않습니다.","카메라 권한 거절 시 갤러리 또는 직접 입력을 제공합니다.","가능한 식별정보 마스킹은 서버 전송 전 수행합니다."],
    ["OCR 촬영 화면","OCR","문서 품질을 검사해 숫자·단위 오인식을 줄입니다.","촬영 안내 확인","처방약 등록 사용자",["문서 가이드","모서리 감지","기울기·흐림·반사","셔터"],"품질 통과 이미지로 OCR 분석을 시작합니다.","원본은 결과 확인 화면에서 인식 값과 나란히 표시합니다.","흐림·반사·잘림이 심하면 다음 단계를 차단합니다.","품질 임계값은 필드별 OCR 정확도와 연결해 조정합니다."],

    ["병용 점검 준비","점검","비교할 제품·성분과 적용할 규칙 범위를 실행 전에 공개합니다.","신규 제품 등록 또는 전체 재점검 선택","모든 사용자",["기존 제품","신규 제품","점검 항목","비교 대상 수정"],"전체 성분 조합 점검을 시작합니다.","복용 중이 아닌 제품은 기본 제외하며 누락 제품은 결과에 반영되지 않습니다.","불완전 성분 제품이 포함되면 판단 불가 가능성을 표시합니다.","비교 대상 스냅샷을 점검 요청과 함께 저장합니다."],

    ["병용 점검 결과 요약","결과","다섯 결과 등급을 중요도순으로 보여주고 안전 여부의 이분법을 피합니다.","규칙 엔진 점검 완료","모든 사용자",["등급별 개수","결과 카드","등급 필터","근거·갱신일"],"카드 펼치기·상세·근거·성분 조합으로 이동합니다.","정보 없음과 안전함을 구분하고 여러 결과가 동시에 존재할 수 있음을 표시합니다.","AI 설명 불일치 시 설명만 숨기고 규칙 엔진 등급을 유지합니다.","정렬 기준과 필터는 등급 코드 기반으로 구현합니다."],

    ["성분·효능 중복 결과 상세","결과","동일성분과 유사 효능군 중복, 계산 가능한 하루 총량을 구분합니다.","중복 카드 선택","중복 결과 사용자",["중복 성분","제품별 함량","하루 총량","공식 기준"],"제품·복용정보를 확인하고 결과를 저장합니다.","함량·복용량이 없으면 총량을 추측하지 않으며 공식 기준이 있을 때만 비교합니다.","확인되지 않은 복용정보가 있으면 총량 계산 불가로 표시합니다.","성분 합산 단위 변환과 투여경로 일치 여부를 검증합니다."],

    ["판단 불가","결과","제품·성분·근거가 부족할 때 AI 추론을 차단하고 원인을 안내합니다.","식별·데이터·근거 조건 미충족","모든 사용자",["원인","미확인 필드","원본·검색·수정","점검 종료"],"정보를 보완한 후에만 재점검합니다.","판단 불가는 오류가 아니라 안전한 정상 상태입니다.","성분 미공개·해외 미등록·근거 충돌·출처 없음 등을 구분합니다.","원인 코드를 구조화해 보완 가능한 필드만 안내합니다."],

  function dataHandling(i){if(i>=10&&i<=13)return "OCR 원본·필드별 신뢰도·사용자 수정값·표준 매칭을 분리해 저장합니다.";if(i>=16&&i<=26)return "비교 대상 스냅샷, 성분 조합, 규칙 결과, 출처, AI 설명을 서로 분리해 버전 관리합니다.";if(i>=30)return "프로필 단위로 암호화 저장하고 조회·수정·삭제 이력을 남깁니다.";return "현재 프로필에 연결된 가상 데이터를 기기 화면에서만 시뮬레이션합니다."}
  function buildNav(){let h="";Object.entries(groups).forEach(([g,[a,b]])=>{h+=`<div class="group">${g}</div>`;for(let i=a;i<b;i++)h+=`<button data-screen="${i}"><span>${String(i+1).padStart(2,"0")}</span><span>${S[i][0]}</span></button>`});nav.innerHTML=h;nav.onclick=e=>{const b=e.target.closest("[data-screen]");if(b)go(+b.dataset.screen)}}
  function go(i){stopProgress();state.current=Math.max(0,Math.min(32,i));document.getElementById("topTitle").textContent=S[state.current][0];document.getElementById("phoneTitle").textContent=S[state.current][0].slice(0,17);document.getElementById("count").textContent=`${String(state.current+1).padStart(2,"0")} / 33`;body.innerHTML=render(state.current);explain.innerHTML=explainPanel(state.current);nav.querySelectorAll("[data-screen]").forEach(x=>x.classList.toggle("active",+x.dataset.screen===state.current));nav.querySelector(".active")?.scrollIntoView({block:"nearest"});bind();if(state.current===11)startProgress(12);if(state.current===17)startProgress(18);window.scrollTo({top:0,behavior:"smooth"})}
  function bind(){document.querySelectorAll("#body [data-go],#tabs [data-go]").forEach(x=>x.onclick=()=>go(+x.dataset.go));document.querySelectorAll("#body [data-act]").forEach(x=>x.onclick=()=>act(x.dataset.act,x));
    if(state.current===1){const cs=[...body.querySelectorAll(".essential")],n=document.getElementById("consentNext"),sync=()=>n.disabled=!cs.every(x=>x.checked);cs.forEach(x=>x.onchange=sync);document.getElementById("allConsent").onclick=()=>{cs.forEach(x=>x.checked=true);sync();toastMsg("필수 항목에 동의했습니다.")}}
    const oc=document.getElementById("ocrConfirm");if(oc)oc.onchange=()=>document.getElementById("ocrNext").disabled=!oc.checked;
    const se=document.getElementById("search");if(se)se.oninput=()=>toastMsg(`“${se.value}” 제품 후보를 찾았습니다.`);
  }
  function act(a,el){
    if(["profile","toast","state"].includes(a)){toastMsg(a==="profile"?"김하늘 프로필이 선택되었습니다.":"설정이 가상으로 저장되었습니다.");return}
    if(a==="filter"||a==="result-filter"){el.parentElement.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));el.classList.add("active");toastMsg(`${el.textContent} 필터를 적용했습니다.`);return}
    if(a==="scan"){document.getElementById("barcodeCandidate").innerHTML=`<b>오메가 밸런스 캡슐</b><br>헬스랩 · 제품 후보 1개 · 최종 성분 확인 필요`;document.getElementById("barcodeNext").disabled=false;return}
    if(a==="barcode"){modal("바코드 번호 입력","가상 바코드 8801234567890을 입력했습니다.",[{t:"후보 찾기",action:"scan",c:"primary"},{t:"취소"}]);return}
    if(a==="capture"){state.progress=0;go(11);return}
    if(a==="camera"){modal("원본 이미지 보기","식별정보가 마스킹된 가상 처방전·약봉투 이미지를 표시합니다.");return}
    if(a==="edit"){body.querySelectorAll(".input").forEach(x=>x.removeAttribute("readonly"));toastMsg("직접 수정 모드입니다. 수정 이력이 기록됩니다.");return}
    if(a==="candidates"){modal("유사 제품 후보 3개","제조사·함량·제형을 비교해 직접 선택하세요. 앱은 자동 선택하지 않습니다.",[{t:"후보 비교",go:7,c:"primary"},{t:"닫기"}]);return}
    if(a==="unregistered"){modal("데이터베이스 미등록 제품","미등록 제품을 일반 제품으로 추정하지 않습니다. 성분표 촬영 또는 직접 입력은 가능하지만 결과 제공이 제한될 수 있습니다.",[{t:"성분표 촬영",go:10,c:"primary"},{t:"닫기"}]);return}
    if(a==="check-start"){state.progress=0;go(17);return}
    if(a==="expand"){el.closest(".result").classList.toggle("open");return}
    if(a==="cancel"){stopProgress();modal("분석을 취소할까요?","입력한 데이터는 임시 보관되며 불완전한 상태에서는 결과를 제공하지 않습니다.",[{t:"계속 분석",action:"continue",c:"primary"},{t:"취소하고 돌아가기",go:16,c:"danger"}]);return}
    if(a==="continue"){closeModal();go(state.current);return}
    if(a==="ai-question"){modal("제한된 AI 설명",`<b>${el.textContent.trim()}</b><br><br>은행잎추출물과 성분 B1 조합에 공식 병용주의 정보가 연결되어 있습니다.<br><br>출처: OFF-INT-0028 · 갱신 2026.07.25`);return}
    if(a==="ai-input"){const v=document.getElementById("aiInput").value||"기존 약을 중단해야 하나요?";modal("답변 범위 제한",`“${v}”<br><br>이 질문은 등록 정보와 판정 근거 설명 범위를 벗어납니다. AI는 복용 중단·간격·용량·교체 또는 증상 원인을 판단하지 않습니다.`);return}
    if(a==="save-result"){toastMsg("점검 결과를 이력에 저장했습니다.");return}
    if(a==="reminder"){toastMsg("확인된 복용정보로 알림을 등록했습니다.");setTimeout(()=>go(3),650);return}
    if(a==="pause-product"||a==="end-product"){toastMsg(a==="pause-product"?"제품을 일시 중단 상태로 변경했습니다.":"복용 종료 상태로 변경했습니다.");return}
    if(a==="export"){modal("CSV 내보내기","암호화된 저장소에서 사용자가 선택한 복용 정보만 CSV로 생성합니다. 생성 파일의 보관과 재공유에 주의하세요.",[{t:"가상 파일 생성",action:"exported",c:"primary"},{t:"취소"}]);return}
    if(a==="exported"){closeModal();toastMsg("가상 CSV 내보내기가 완료되었습니다.");return}
    if(a==="delete"){modal("삭제 범위를 확인하세요","현재 프로필의 선택 데이터가 삭제됩니다. 과거 점검 이력과 백업의 처리 범위·기간은 별도로 안내됩니다.",[{t:"삭제",action:"deleted",c:"danger"},{t:"취소"}]);return}
    if(a==="deleted"){closeModal();toastMsg("선택한 데이터가 삭제되었습니다.");return}
  }
  function startProgress(next){stopProgress();state.timer=setInterval(()=>{state.progress=Math.min(100,state.progress+4);const b=document.getElementById("bar"),p=document.getElementById("pct");if(b)b.style.width=state.progress+"%";if(p)p.textContent=state.progress+"%";if(state.progress>=100){stopProgress();toastMsg("처리가 완료되었습니다.");setTimeout(()=>go(next),550)}},170)}
  function stopProgress(){if(state.timer)clearInterval(state.timer);state.timer=null}
  function modal(title,copy,buttons=[{t:"확인",c:"primary"}]){document.getElementById("modal").innerHTML=`<h3 id="modalTitle">${title}</h3><p>${copy}</p>${buttons.map(b=>`<button class="btn ${b.c||"ghost"}" ${b.go!==undefined?`data-mgo="${b.go}"`:""} ${b.action?`data-mact="${b.action}"`:""}>${b.t}</button>`).join("")}`;document.getElementById("modalBg").classList.add("show");document.querySelectorAll("[data-mgo]").forEach(x=>x.onclick=()=>{closeModal();go(+x.dataset.mgo)});document.querySelectorAll("[data-mact]").forEach(x=>x.onclick=()=>act(x.dataset.mact,x));document.querySelectorAll("#modal .btn:not([data-mgo]):not([data-mact])").forEach(x=>x.onclick=closeModal)}
  function closeModal(){document.getElementById("modalBg").classList.remove("show")}
  function toastMsg(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(toastMsg.t);toastMsg.t=setTimeout(()=>x.classList.remove("show"),2200)}
  document.getElementById("back").onclick=()=>go(state.current-1);document.getElementById("more").onclick=()=>toastMsg("화면별 추가 메뉴입니다.");document.getElementById("modalBg").onclick=e=>{if(e.target.id==="modalBg")closeModal()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();if(e.altKey&&e.key==="ArrowLeft")go(state.current-1);if(e.altKey&&e.key==="ArrowRight")go(state.current+1)});
  buildNav();go(0);
  </script>
</body>
</html>
