name: medassist-demo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    tmpfs:
      - /tmp:size=32m,mode=1777
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_ADDRESS: ${SERVER_ADDRESS:-http://localhost}
      DEMO_API_TOKEN: ${DEMO_API_TOKEN:?Set DEMO_API_TOKEN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - app-internal
      - egress
    depends_on:
      server:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.50
    logging: *default-logging

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      TZ: Asia/Seoul
      DEBUG: "false"
      DB_PATH: /var/lib/medassist/db/medassist
      DB_USERNAME: ${DB_USERNAME:-sa}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MEDASSIST_STORAGE_ROOT: /var/lib/medassist/recordings
      BACKEND_BASE_URL: http://backend:8081
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_SUMMARY_MODEL: ${OPENAI_SUMMARY_MODEL:-gpt-4o-mini}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      AI_CORE_POOL_SIZE: ${AI_CORE_POOL_SIZE:-1}
      AI_MAX_POOL_SIZE: ${AI_MAX_POOL_SIZE:-2}
      AI_QUEUE_CAPACITY: ${AI_QUEUE_CAPACITY:-8}
      AI_MAX_ATTEMPTS: ${AI_MAX_ATTEMPTS:-2}
      AI_RETRY_BACKOFF_MS: ${AI_RETRY_BACKOFF_MS:-1000}
      UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_FILE_SIZE:-30MB}
      UPLOAD_MAX_REQUEST_SIZE: ${UPLOAD_MAX_REQUEST_SIZE:-32MB}
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError -Duser.timezone=Asia/Seoul
    volumes:
      - server-db:/var/lib/medassist/db
      - recordings:/var/lib/medassist/recordings
    networks:
      - app-internal
      - egress
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    mem_limit: 1536m
    cpus: 1.50
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      TZ: Asia/Seoul
      DEBUG: "false"
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:?Set DATA_GO_KR_SERVICE_KEY in .env}
      DATA_GO_KR_SERVICE_KEY_ENCODED: ${DATA_GO_KR_SERVICE_KEY_ENCODED:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o-mini}
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError -Duser.timezone=Asia/Seoul
    networks:
      - app-internal
      - egress
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    mem_limit: 1280m
    cpus: 1.25
    logging: *default-logging

networks:
  app-internal:
    internal: true
  egress: {}

volumes:
  server-db:
    name: ${SERVER_DB_VOLUME:-medassist-demo-server-db}
  recordings:
    name: ${RECORDINGS_VOLUME:-medassist-demo-recordings}
  caddy-data:
  caddy-config:
